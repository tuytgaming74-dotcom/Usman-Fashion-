<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usman Fashion - Admin Orders</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f6f6;
      color: #222;
    }

    .header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      letter-spacing: 2px;
    }

    .login-box,
    .orders-box {
      max-width: 1100px;
      margin: 35px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .login-box {
      max-width: 420px;
    }

    input,
    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 7px;
      font-size: 15px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      border: 0;
      background: #111;
      color: white;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .logout {
      max-width: 180px;
      margin-bottom: 20px;
    }

    .message {
      margin-top: 15px;
      font-weight: bold;
    }

    .order {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 18px;
      margin-top: 15px;
      background: #fff;
    }

    .order h3 {
      margin-top: 0;
    }

    .order p {
      margin: 7px 0;
    }

    .status {
      font-weight: bold;
    }

    .status-select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 7px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>USMAN FASHION</h1>
    <p>Admin Orders Panel</p>
  </div>

  <div id="loginBox" class="login-box">
    <h2>Admin Login</h2>

    <input type="email" id="email" placeholder="Admin Email">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div id="loginMessage" class="message"></div>
  </div>

  <div id="ordersBox" class="orders-box hidden">

    <button class="logout" onclick="logout()">Logout</button>

    <h2>Customer Orders</h2>

    <div id="orders"></div>

  </div>


<script>

const SUPABASE_URL = "https://adyrjpvxhmuqcgisqksk.supabase.co";

/*
  Yahan apni Supabase ki PUBLISHABLE key paste karein.
  Secret key bilkul paste nahi karni.
*/
const SUPABASE_KEY = "sb_publishable_DwtyDABVxRB3lLM76HVnLQ_C9AV95Gs"


async function login() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const message = document.getElementById("loginMessage");

  message.textContent = "Logging in...";

  const response = await fetch(
    SUPABASE_URL + "/auth/v1/token?grant_type=password",
    {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email: email,
        password: password
      })
    }
  );

  const data = await response.json();

  if (!response.ok) {
    message.textContent = data.msg || data.error_description || "Login failed.";
    return;
  }

  localStorage.setItem("admin_access_token", data.access_token);

  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("ordersBox").classList.remove("hidden");

  loadOrders();
}


async function loadOrders() {

  const token = localStorage.getItem("admin_access_token");
  const ordersDiv = document.getElementById("orders");

  ordersDiv.innerHTML = "<p>Loading orders...</p>";

  const response = await fetch(
    SUPABASE_URL + "/rest/v1/orders?select=*&order=created_at.desc",
    {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + token
      }
    }
  );

  const data = await response.json();

  if (!response.ok) {
    ordersDiv.innerHTML = "<p>Orders load nahi ho sake: " + (data.message || data.error_description || data.hint || JSON.stringify(data)) + "</p>";
    return;
  }

  if (!data.length) {
    ordersDiv.innerHTML = "<p>No orders found.</p>";
    return;
  }

  ordersDiv.innerHTML = "";

  data.forEach(order => {

    const div = document.createElement("div");
    div.className = "order";

    div.innerHTML = `
      <h3>Order: UF-${String(order.id).substring(0,8).toUpperCase()}</h3>

      <p><strong>Name:</strong> ${order.customer_name || ""}</p>
      <p><strong>Phone:</strong> ${order.phone || ""}</p>
      <p><strong>Address:</strong> ${order.address || ""}</p>
      <p><strong>City:</strong> ${order.city || ""}</p>
      <p><strong>Product:</strong> ${order.product || ""}</p>
      <p><strong>Size:</strong> ${order.size || ""}</p>
      <p><strong>Quantity:</strong> ${order.quantity || ""}</p>
      <p><strong>Payment:</strong> ${order.payment_method || ""}</p>
      <p><strong>Note:</strong> ${order.note || ""}</p>

      <p class="status">
        Current Status: ${order.status || "New"}
      </p>

      <select class="status-select"
        onchange="updateStatus('${order.id}', this.value)">
        <option value="New" ${order.status === "New" ? "selected" : ""}>New</option>
        <option value="Confirmed" ${order.status === "Confirmed" ? "selected" : ""}>Confirmed</option>
        <option value="Shipped" ${order.status === "Shipped" ? "selected" : ""}>Shipped</option>
        <option value="Delivered" ${order.status === "Delivered" ? "selected" : ""}>Delivered</option>
        <option value="Cancelled" ${order.status === "Cancelled" ? "selected" : ""}>Cancelled</option>
      </select>
    `;

    ordersDiv.appendChild(div);
  });
}


async function updateStatus(id, status) {

  const token = localStorage.getItem("admin_access_token");

  const response = await fetch(
    SUPABASE_URL + "/rest/v1/orders?id=eq." + id,
    {
      method: "PATCH",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + token,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify({
        status: status
      })
    }
  );

  if (response.ok) {
    alert("Order status updated.");
    loadOrders();
  } else {
    alert("Status update failed.");
  }
}


function logout() {

  localStorage.removeItem("admin_access_token");

  document.getElementById("ordersBox").classList.add("hidden");
  document.getElementById("loginBox").classList.remove("hidden");
}


</script>

</body>
</html>
